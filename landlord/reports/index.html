<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#194D3A">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Portfolio reports — easierLet</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/assets/easierlet.css?v=20260610a">
  <link rel="stylesheet" href="/assets/portal.css?v=20260428a">
  <style>
    .report-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--el-line-soft); }
    .report-view { font-size: 14px; line-height: 1.65; color: var(--el-ink-soft); }
    .report-view h3 { font-size: 15px; color: var(--el-ink); margin: 18px 0 6px; }
    .report-view ul { padding-left: 20px; margin: 0 0 10px; }
  </style>
</head>
<body class="elp-body">

<div id="portal-shell" data-role="landlord" data-active="home" data-title="Portfolio reports"></div>

<main class="elp-main">
  <div class="elp-main-inner" style="max-width:760px">

    <div class="elp-page-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div>
        <h1 class="elp-page-title">Portfolio reports</h1>
        <p class="elp-page-sub">AI-generated summaries of compliance, maintenance, finances and tenancy events.</p>
      </div>
      <button class="el-btn el-btn-primary" id="generateBtn">Generate now</button>
    </div>

    <div class="el-ai-banner">
      <span class="el-ai-icon">✨</span>
      <div><strong>Generated by EasierLet AI</strong> — reports are guidance only and do not constitute legal, financial, or tax advice. <a href="/ai-transparency/" target="_blank">Learn more</a></div>
    </div>

    <div class="elp-card">
      <div id="reportsList" class="elp-list">
        <div class="elp-loading"><div class="elp-spinner"></div>Loading reports…</div>
      </div>
    </div>

    <div class="elp-card" id="reportViewCard" style="display:none;margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h3 style="margin:0" id="reportViewTitle">Report</h3>
        <button class="el-btn el-btn-ghost" id="reportViewClose" style="font-size:13px">Close</button>
      </div>
      <div class="report-view" id="reportView"></div>
    </div>

  </div>
</main>

<script type="module" src="/assets/portal.js"></script>
<script type="module">
  while (!window.ELP) await new Promise((r) => setTimeout(r, 30));
  const ELP = window.ELP;
  const $ = (id) => document.getElementById(id);

  const session = await ELP.requireSession("/login/");
  if (!session) throw new Error("redirecting");
  ELP.mountShell({ user: session.user });

  let reports = [];

  async function load() {
    try {
      reports = await ELP.rest(
        `landlord_reports?select=id,period_start,period_end,report_type,urgency_score,generated_at,pdf_storage_path,content_json&order=generated_at.desc&limit=40`
      ) ?? [];
      render();
    } catch (e) {
      console.error(e);
      $("reportsList").innerHTML = `<p style="color:var(--el-muted);font-size:14px">Couldn't load reports — try refreshing.</p>`;
    }
  }

  function render() {
    if (!reports.length) {
      $("reportsList").innerHTML = `
        <div class="elp-empty">
          <h3>No reports yet</h3>
          <p>EasierLet generates a report when there's something worth telling you — upcoming certificate renewals, tenancy events, or maintenance patterns. You can also generate one now.</p>
        </div>`;
      updateGenerateButton();
      return;
    }
    $("reportsList").innerHTML = reports.map((r) => `
      <div class="report-row">
        <div>
          <div style="font-weight:600;font-size:14.5px">${ELP.esc(r.content_json?.period || `${ELP.fmtDate(r.period_start)} – ${ELP.fmtDate(r.period_end)}`)}</div>
          <div style="font-size:12.5px;color:var(--el-muted)">${ELP.esc(r.report_type)} · generated ${ELP.fmtDate(r.generated_at)}${r.urgency_score ? ` · score ${r.urgency_score}` : ""}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="el-btn" data-view="${r.id}" style="font-size:13px">View</button>
          ${r.pdf_storage_path ? `<button class="el-btn" data-pdf="${r.id}" style="font-size:13px">PDF</button>` : ""}
        </div>
      </div>`).join("");

    document.querySelectorAll("[data-view]").forEach((btn) =>
      btn.addEventListener("click", () => viewReport(btn.dataset.view)));
    document.querySelectorAll("[data-pdf]").forEach((btn) =>
      btn.addEventListener("click", () => openPdf(btn.dataset.pdf)));
    updateGenerateButton();
  }

  function updateGenerateButton() {
    const btn = $("generateBtn");
    if (!ELP.flags?.ai_portfolio_report) {
      btn.disabled = true;
      btn.textContent = "AI reports not enabled";
      return;
    }
    const last = reports[0]?.generated_at;
    if (last && Date.now() - new Date(last).getTime() < 7 * 86400000) {
      const days = Math.ceil(7 - (Date.now() - new Date(last).getTime()) / 86400000);
      btn.disabled = true;
      btn.textContent = `Available in ${days} day${days === 1 ? "" : "s"}`;
    } else {
      btn.disabled = false;
      btn.textContent = "Generate now";
    }
  }

  function viewReport(id) {
    const r = reports.find((x) => x.id === id);
    const c = r?.content_json;
    if (!c) return;
    $("reportViewTitle").textContent = `Portfolio report — ${c.period ?? ""}`;
    const list = (arr, fmt) => Array.isArray(arr) && arr.length ? `<ul>${arr.map((x) => `<li>${fmt(x)}</li>`).join("")}</ul>` : "";
    $("reportView").innerHTML = `
      ${c.portfolio_snapshot ? `<h3>Portfolio snapshot</h3><p>${ELP.esc(c.portfolio_snapshot)}</p>` : ""}
      ${c.financial_summary ? `<h3>Financial summary</h3><p>${ELP.esc(c.financial_summary)}</p>` : ""}
      ${c.maintenance_roundup ? `<h3>Maintenance round-up</h3><p>${ELP.esc(c.maintenance_roundup)}</p>` : ""}
      ${list(c.compliance_calendar, (x) => `${ELP.esc(x.item)} — due ${ELP.esc(x.due ?? "")}. ${ELP.esc(x.action ?? "")}`) ? `<h3>Compliance calendar</h3>${list(c.compliance_calendar, (x) => `${ELP.esc(x.item)} — due ${ELP.esc(x.due ?? "")}. ${ELP.esc(x.action ?? "")}`)}` : ""}
      ${list(c.tenancy_events, (x) => `${ELP.esc(x.event)}${x.property ? ` — ${ELP.esc(x.property)}` : ""}${x.date ? ` (${ELP.esc(x.date)})` : ""}`) ? `<h3>Tenancy events</h3>${list(c.tenancy_events, (x) => `${ELP.esc(x.event)}${x.property ? ` — ${ELP.esc(x.property)}` : ""}${x.date ? ` (${ELP.esc(x.date)})` : ""}`)}` : ""}
      ${list(c.upcoming_3_months, (x) => `${ELP.esc(x.date ?? "")} — ${ELP.esc(x.item ?? "")}`) ? `<h3>Next 3 months</h3>${list(c.upcoming_3_months, (x) => `${ELP.esc(x.date ?? "")} — ${ELP.esc(x.item ?? "")}`)}` : ""}
      ${list(c.suggested_actions, (x) => `<strong>${x.priority ?? ""}.</strong> ${ELP.esc(x.action ?? "")}${x.deadline ? ` — by ${ELP.esc(x.deadline)}` : ""}`) ? `<h3>Suggested actions</h3>${list(c.suggested_actions, (x) => `<strong>${x.priority ?? ""}.</strong> ${ELP.esc(x.action ?? "")}${x.deadline ? ` — by ${ELP.esc(x.deadline)}` : ""}`)}` : ""}
      ${c.regulatory_note ? `<h3>Regulatory note</h3><p>${ELP.esc(c.regulatory_note)}</p><p style="font-size:12px;color:var(--el-muted)">Verify regulatory information with a professional source before acting on it.</p>` : ""}
    `;
    $("reportViewCard").style.display = "block";
    $("reportViewCard").scrollIntoView({ behavior: "smooth" });
  }

  async function openPdf(id) {
    const r = reports.find((x) => x.id === id);
    if (!r?.pdf_storage_path) return;
    const { data, error } = await ELP.client.storage.from("documents").createSignedUrl(r.pdf_storage_path, 3600);
    if (error || !data?.signedUrl) { ELP.toast("Couldn't open the PDF", "error"); return; }
    window.open(data.signedUrl, "_blank");
  }

  $("reportViewClose").addEventListener("click", () => { $("reportViewCard").style.display = "none"; });

  $("generateBtn").addEventListener("click", async () => {
    const btn = $("generateBtn");
    btn.disabled = true;
    btn.textContent = "Generating… (can take ~30s)";
    try {
      const res = await ELP.callFn("ai-report", { report_type: "triggered" });
      if (res.data?.skipped === "too_recent") {
        ELP.toast("A report was generated in the last 7 days.", "info");
      } else if (res.data?.skipped === "no_properties") {
        ELP.toast("Add a property first — there's nothing to report on yet.", "info");
      } else if (res.data?.error === "ai_budget_exceeded") {
        ELP.toast("Your AI budget is used up for this month — it resets on the 1st.", "info");
      } else if (!res.ok || res.data?.error) {
        throw new Error(res.data?.error || "failed");
      } else {
        ELP.toast("Report generated — check your email too.", "success");
      }
      await load();
    } catch (e) {
      console.error(e);
      ELP.toast("Couldn't generate the report — try again later.", "error");
      updateGenerateButton();
    }
  });

  await load();
</script>
</body>
</html>
