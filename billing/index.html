<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#194D3A">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Billing — easierLet</title>
  <meta name="robots" content="noindex">


  <link rel="stylesheet" href="/assets/easierlet.css?v=20260428a">
  <link rel="stylesheet" href="/assets/portal.css?v=20260428a">

  <style>
    .plan-summary {
      background: linear-gradient(135deg, #1A6B55 0%, #2A8A6E 100%);
      color: #fff; border-radius: 16px;
      padding: 24px; margin-bottom: 20px;
    }
    .plan-summary .plan-name {
      font-family: var(--font-sans); font-weight: 400;
      font-size: 28px; letter-spacing: -0.4px; margin-bottom: 4px;
    }
    .plan-summary .plan-status { font-size: 13px; color: rgba(255,255,255,0.85); }
    .plan-summary .plan-meta {
      display: flex; gap: 24px; flex-wrap: wrap; margin-top: 18px;
    }
    .plan-summary .meta-cell .label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.65); margin-bottom: 2px;
    }
    .plan-summary .meta-cell .value { font-size: 16px; font-weight: 600; }

    .pricing-grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 20px;
    }
    .price-tile {
      background: #fff; border: 1px solid var(--el-line-soft);
      border-radius: 14px; padding: 20px;
      display: flex; flex-direction: column;
    }
    .price-tile.is-current { border-color: var(--el-green); border-width: 2px; }
    .price-tile.is-picked { border-color: var(--el-green); border-width: 2px; box-shadow: 0 0 0 3px rgba(26,107,85,0.18); }
    .price-tile h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--el-muted); margin: 0 0 8px; }
    .price-tile .amount { font-family: var(--font-sans); font-size: 26px; color: var(--el-ink); margin: 0 0 4px; }
    .price-tile .amount small { font-size: 13px; color: var(--el-muted); font-family: inherit; }
    .price-tile .scope { font-size: 13px; color: var(--el-ink-soft); margin: 0 0 14px; }
    .price-tile .upgrade-btn { margin-top: auto; }
    .badge-current {
      display: inline-block; background: var(--el-green-pale); color: var(--el-green);
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      margin-bottom: 8px;
    }

    .alert {
      padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px;
    }
    .alert.warn { background: #FFF8EC; color: #8A6000; border: 1px solid #F0D080; }
    .alert.error { background: #FBE0E0; color: #B23434; border: 1px solid #F0C8C8; }
  </style>
</head>
<body class="elp-body">

<div id="portal-shell" data-role="landlord" data-active="settings" data-title="Billing"></div>

<main class="elp-main">
  <div class="elp-main-inner">
    <div class="elp-page-head">
      <h1 class="elp-page-title">Billing</h1>
      <p class="elp-page-sub">Your easierLet plan, usage and payment method.</p>
    </div>

    <div id="loadingBox" class="elp-loading"><div class="elp-spinner"></div>Loading your subscription…</div>
    <div id="contentBox" style="display:none">

      <div id="alertBox"></div>

      <div class="plan-summary">
        <div class="plan-name" id="planName">—</div>
        <div class="plan-status" id="planStatus">—</div>
        <div class="plan-meta">
          <div class="meta-cell">
            <div class="label">Properties</div>
            <div class="value" id="propUsage">—</div>
          </div>
          <div class="meta-cell" id="trialCell" style="display:none">
            <div class="label">Trial ends</div>
            <div class="value" id="trialEnds">—</div>
          </div>
          <div class="meta-cell" id="renewCell" style="display:none">
            <div class="label">Next payment</div>
            <div class="value" id="renewDate">—</div>
          </div>
        </div>
        <div id="manageWrap" style="margin-top:18px;display:none;gap:10px;flex-wrap:wrap">
          <button class="el-btn el-btn-secondary" id="manageBtn" style="background:#fff;color:#1A6B55">Manage billing</button>
        </div>
      </div>

      <h2 id="plansHeading" style="font-family:var(--font-sans);font-weight:400;font-size:22px;margin:0 0 14px">Subscribe</h2>
      <div class="pricing-grid" id="plansGrid" style="max-width:360px"></div>
    </div>
  </div>
</main>

<script type="module" src="/assets/portal.js"></script>
<script type="module">
  while (!window.ELP) await new Promise((r) => setTimeout(r, 30));
  const ELP = window.ELP;
  const session = await ELP.requireSession("/login/");
  if (!session) throw new Error("redirecting");
  ELP.mountShell({ user: session.user });
  const user = session.user;
  const $ = (id) => document.getElementById(id);

  // Pricing v2 (Oct 2026): one plan, unlimited properties, 6-month free
  // trial, then £4.99 a month. Keep in step with supabase/functions/_shared/pricing.ts.
  const PRICE = 4.99;
  const PLAN_LABELS = { trial: "Free trial", standard: "easierLet", starter: "easierLet", growth: "easierLet", professional: "easierLet" };
  // Stripe needs a carried-over trial to end at least 48 hours ahead.
  const MIN_CARRY_MS = 49 * 60 * 60 * 1000;

  const fmtMoney = (n) => "£" + n.toFixed(2);
  const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

  function alertBox(kind, msg) {
    $("alertBox").innerHTML = `<div class="alert ${kind}">${ELP.esc(msg)}</div>`;
  }

  // One tile. What it says depends on where the landlord is:
  // - Subscribed (active / past_due): "Your plan", no button (Manage
  //   billing above handles card changes and cancelling).
  // - On a trial with 2+ days left: subscribing now keeps the rest of the
  //   trial, so the button says when the first payment will be.
  // - Trial ending, expired or cancelled: subscribe and pay today.
  function renderPlans(sub) {
    const grid = $("plansGrid");
    const subscribed = (sub.status === "active" || sub.status === "past_due");
    $("plansHeading").textContent = subscribed ? "Your plan" : "Subscribe";

    const carriesTrial = sub.status === "trialing" && sub.trial_ends_at
      && (new Date(sub.trial_ends_at) - new Date()) >= MIN_CARRY_MS;
    let note = "", cta = "", disabled = false;
    if (subscribed) {
      cta = "Your current plan"; disabled = true;
    } else if (carriesTrial) {
      cta = "Subscribe now";
      note = `You won't be charged until your free trial ends on ${fmtDate(sub.trial_ends_at)}.`;
    } else {
      cta = `Subscribe for ${fmtMoney(PRICE)} a month`;
    }

    grid.innerHTML = `
      <div class="price-tile${subscribed ? " is-current" : " is-picked"}">
        ${subscribed ? `<span class="badge-current">Current plan</span>` : ""}
        <h3>easierLet</h3>
        <div class="amount">${fmtMoney(PRICE)} <small>/ month</small></div>
        <p class="scope">Unlimited properties. Every feature included. Cancel any time.</p>
        ${note ? `<p class="scope" style="color:var(--el-muted)">${ELP.esc(note)}</p>` : ""}
        <button class="el-btn ${subscribed ? "el-btn-secondary" : "el-btn-primary"} upgrade-btn"
                data-checkout="standard" ${disabled ? "disabled" : ""}>${ELP.esc(cta)}</button>
      </div>
    `;
  }

  async function load() {
    const [subs, props] = await Promise.all([
      ELP.rest(`landlord_subscriptions?user_id=eq.${user.id}&select=plan,status,trial_ends_at,current_period_end,property_limit,stripe_customer_id,selected_plan&limit=1`).catch(() => []),
      ELP.rest(`properties?user_id=eq.${user.id}&archived=eq.false&select=id`).catch(() => []),
    ]);
    const sub = subs[0] || { plan: "trial", status: "trialing", property_limit: null };
    const propCount = props.length;

    const planLabel = PLAN_LABELS[sub.plan] || sub.plan;
    $("planName").textContent = sub.plan === "trial"
      ? planLabel
      : `${planLabel} · ${fmtMoney(PRICE)}/month`;

    const statusLabels = {
      trialing: "On a free trial",
      active:   "Active subscription",
      past_due: "⚠️ Payment past due",
      cancelled:"Cancelled",
      expired:  "Trial ended — subscribe to continue",
    };
    $("planStatus").textContent = statusLabels[sub.status] || sub.status;

    $("propUsage").textContent = `${propCount} · no limit`;

    if (sub.trial_ends_at) {
      const days = Math.max(0, Math.round((new Date(sub.trial_ends_at) - new Date()) / 86400000));
      $("trialEnds").textContent = days === 0 ? "Today" : `${days} day${days === 1 ? "" : "s"}`;
      $("trialCell").style.display = "";
    }
    if (sub.current_period_end) {
      $("renewDate").textContent = new Date(sub.current_period_end).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      $("renewCell").style.display = "";
    }

    if (sub.status === "past_due") {
      alertBox("warn", "Your last payment was declined. Update your card via Manage billing to keep your account active.");
    } else if (sub.status === "expired" || sub.status === "cancelled") {
      alertBox("warn", sub.status === "expired"
        ? "Your free trial has ended. Subscribe below to keep using easierLet."
        : "Your subscription is no longer active. Subscribe below to keep using easierLet.");
    } else if (sub.status === "trialing" && sub.trial_ends_at) {
      const days = Math.max(0, Math.round((new Date(sub.trial_ends_at) - new Date()) / 86400000));
      if (days <= 3) alertBox("warn", `Your trial ends in ${days} day${days === 1 ? "" : "s"}. Subscribe to keep going.`);
    }

    renderPlans(sub);

    // Only show "Manage billing" once a Stripe customer exists (i.e. they've
    // completed at least one checkout). Otherwise the portal call would
    // 404 with no_customer.
    if (sub.stripe_customer_id) {
      $("manageWrap").style.display = "flex";
      $("manageBtn").addEventListener("click", openPortal);
    }

    document.querySelectorAll("[data-checkout]").forEach((b) =>
      b.addEventListener("click", () => startCheckout(b))
    );

    $("loadingBox").style.display = "none";
    $("contentBox").style.display = "";
  }

  async function startCheckout(btn) {
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = "Opening checkout…";
    try {
      // ELP.callFn(name, body) — second arg is the JSON-encodable body.
      // Returns { ok, status, data }, where `data` is the parsed JSON.
      const res = await ELP.callFn("create-checkout-session", {});
      if (res.ok && res.data?.checkout_url) {
        window.location.href = res.data.checkout_url;
        return;
      }
      // Already subscribed (e.g. a second tab) — no second Checkout.
      if (res.ok && res.data?.already_subscribed) {
        alertBox("warn", res.data.message || "You're already subscribed.");
        setTimeout(() => { window.location.reload(); }, 1500);
        return;
      }
      throw new Error(res.data?.message || res.data?.error || "Could not start checkout");
    } catch (e) {
      const msg = e.message || "Couldn't open checkout.";
      if (msg.includes("stripe_not_configured") || msg.includes("not set yet")) {
        alertBox("warn", "Billing setup is still pending — Stripe keys haven't been configured. The signup + portal will switch on once that's done.");
      } else {
        alertBox("error", msg);
      }
      btn.disabled = false; btn.textContent = orig;
    }
  }

  async function openPortal() {
    const btn = $("manageBtn");
    btn.disabled = true; btn.textContent = "Opening…";
    try {
      // No body needed — billing-portal looks the customer up by JWT.
      const res = await ELP.callFn("billing-portal", {});
      if (res.ok && res.data?.portal_url) {
        window.location.href = res.data.portal_url;
        return;
      }
      throw new Error(res.data?.message || res.data?.error || "Could not open billing portal");
    } catch (e) {
      const msg = e.message || "Couldn't open billing.";
      if (msg.includes("stripe_not_configured")) {
        alertBox("warn", "Billing portal isn't configured yet.");
      } else if (msg.includes("no_customer")) {
        alertBox("warn", "No billing record yet — subscribe below first.");
      } else {
        alertBox("error", msg);
      }
      btn.disabled = false; btn.textContent = "Manage billing";
    }
  }

  load();
</script>
</body>
</html>
